name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Una ejecución por rama: un push nuevo cancela la anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck y unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: quality
    # ponytail: un solo dataset `test` compartido → serializamos los E2E de toda la repo.
    # Si la cola se vuelve lenta, pasar a datasets efímeros por PR (requiere plan pago de Sanity).
    concurrency:
      group: e2e-sanity-test-dataset
      cancel-in-progress: false
    env:
      CI: true
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
      SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Seed + build con el entorno E2E
        run: npx tsx scripts/e2e-env-run.ts "npm run e2e:seed && npm run build"
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
